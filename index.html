<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Balance Sheet Check – Prototype</title>
<script>
  // Apply any saved theme override before the stylesheet below is parsed,
  // so there's no flash of the wrong theme. No saved override means no
  // attribute is set, so :root keeps following prefers-color-scheme.
  (function () {
    try {
      var saved = localStorage.getItem('rac-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) { /* localStorage unavailable; falls back to OS preference */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body class="view-check">
<!-- The body class picks the view: view-check (questionnaire only) or view-author (set by js/app.js from #author). -->

<!-- Header: title, theme toggle, Check / Author switch -->
<header>
  <div class="header-inner">
    <div>
      <!-- Replaced from rules.json meta (shortTitle, subtitle) once it loads. -->
      <div class="header-eyebrow">Prototype · Chapter 25 Swedish Companies Act (aktiebolagslagen)</div>
      <h1>Control Balance Sheet Check</h1>
    </div>
    <div class="header-actions">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4"></circle>
          <line x1="12" y1="2" x2="12" y2="4"></line>
          <line x1="12" y1="20" x2="12" y2="22"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="2" y1="12" x2="4" y2="12"></line>
          <line x1="20" y1="12" x2="22" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden>
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <nav class="view-switch" aria-label="View">
        <button class="view-btn" data-view="check" aria-pressed="true">Check a rule</button>
        <button class="view-btn" data-view="author" aria-pressed="false">Author</button>
      </nav>
    </div>
  </div>
</header>

<!-- Author view only: file actions and engine status -->
<div class="toolbar">
  <button class="btn" id="new-rules">New</button>
  <label class="btn" style="margin:0;">
    Upload JSON
    <input type="file" id="upload-json" accept="application/json" style="display:none;">
  </label>
  <button class="btn btn-primary" id="download-json">Download JSON</button>
  <button class="btn btn-primary" id="download-csv" title="Download the test suite as a CSV file">Download CSV</button>
  <div class="spacer"></div>
  <span id="engine-status" class="engine-badge" title="Condition evaluation engine in use"></span>
</div>

<!-- Author view only: tab bar. The Check view always shows Play. -->
<div class="tabs">
  <button class="tab-btn active" data-tab="play">Play</button>
  <button class="tab-btn" data-tab="build">Build</button>
  <button class="tab-btn" data-tab="tests">Test suite</button>
</div>

<main>

  <!-- Each panel is an empty container; js/app.js renders the content. -->
  <div class="tab-panel active" id="tab-play">
    <div id="play-root"></div>
  </div>

  <div class="tab-panel" id="tab-build">
    <section class="builder-block">
      <h3><span class="step-num">1</span> Law / provision</h3>
      <div id="meta-editor"></div>
    </section>

    <section class="builder-block">
      <h3><span class="step-num">2</span> Data dictionary (variables)</h3>
      <div id="attributes-editor"></div>
    </section>

    <section class="builder-block">
      <h3><span class="step-num">3</span> Flowchart</h3>
      <p class="supportive">The whole tree. Click a box to jump to that node below.</p>
      <div id="flowchart"></div>
    </section>

    <section class="builder-block">
      <h3><span class="step-num">4</span> Decision tree nodes</h3>
      <div id="start-editor"></div>
      <div id="nodes-editor"></div>
    </section>

    <section class="builder-block">
      <h3><span class="step-num">5</span> Validation</h3>
      <div id="validation-results"></div>
    </section>

    <section class="builder-block">
      <h3><span class="step-num">6</span> Raw JSON</h3>
      <pre id="json-preview"></pre>
    </section>
  </div>

  <div class="tab-panel" id="tab-tests">
    <div id="tests-root"></div>
  </div>

</main>

<!-- Order matters: the engine bundle sets window.JsonRulesEngine, logic.js sets window.RaC, app.js uses both.
     Bump the ?v= number after editing a file so browsers don't use a cached copy. -->
<script src="vendor/json-rules-engine.bundle.js"></script>
<script src="js/logic.js?v=9"></script>
<script src="js/app.js?v=9"></script>
</body>
</html>
