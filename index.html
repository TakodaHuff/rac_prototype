<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rules as Code Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /*
   * Palette derived from studyinsweden.se: Swedish-flag blue (#005293) and
   * gold (#FECB00) as the two bold accents, near-black text, sharp corners,
   * and one bold geometric sans (Space Grotesk) for display type — a
   * minimalist, Bauhaus-flavored reskin over the same markup and behavior
   * as before. Decoration is kept to a minimum: color and type carry the
   * look, nothing is purely ornamental.
   */
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f0f5fa;
    --border: #d7e0e8;
    --text: #0a0a0a;
    --muted: #5b6472;
    --accent: #005293;
    --accent-dark: #003a6b;
    --accent-ink: #ffffff;
    --accent-soft: #e5f0f9;
    --accent-soft-border: #b8d6ec;
    --gold: #fecb00;
    --gold-ink: #0a0a0a;
    --danger: #c81e1e;
    --danger-soft: #fbe8e8;
    --danger-soft-border: #f0bcbc;
    --warn: #8a6d00;
    --warn-soft: #fff6da;
    --warn-soft-border: #f0da8f;
    --ok: #1b7a3d;
    --ok-soft: #e7f5ec;
    --ok-soft-border: #bee0cb;
    --info-soft: #e5f0f9;
    --info-soft-border: #b8d6ec;
    --info-text: #003a6b;
    --code-bg: #08192b;
    --code-text: #cfe6f7;
    --font-display: "Space Grotesk", "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius: 3px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1e33;
      --surface: #122a47;
      --surface-2: #1a3550;
      --border: #2c4a68;
      --text: #f5f7fa;
      --muted: #d7dee4;
      --accent: #fecb00;
      --accent-dark: #e0b400;
      --accent-ink: #0a1626;
      --accent-soft: #33290c;
      --accent-soft-border: #5c4a14;
      --gold: #fecb00;
      --gold-ink: #0a1626;
      --danger: #ff6b5b;
      --danger-soft: #3a1d18;
      --danger-soft-border: #5c3128;
      --warn: #ffb020;
      --warn-soft: #3a2e10;
      --warn-soft-border: #5c4a1c;
      --ok: #4ade80;
      --ok-soft: #163828;
      --ok-soft-border: #245c40;
      --info-soft: #17324a;
      --info-soft-border: #2c4a68;
      --info-text: #bfe0fa;
      --code-bg: #071018;
      --code-text: #cfe6f7;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1e33;
    --surface: #122a47;
    --surface-2: #1a3550;
    --border: #2c4a68;
    --text: #f5f7fa;
    --muted: #d7dee4;
    --accent: #fecb00;
    --accent-dark: #e0b400;
    --accent-ink: #0a1626;
    --accent-soft: #33290c;
    --accent-soft-border: #5c4a14;
    --gold: #fecb00;
    --gold-ink: #0a1626;
    --danger: #ff6b5b;
    --danger-soft: #3a1d18;
    --danger-soft-border: #5c3128;
    --warn: #ffb020;
    --warn-soft: #3a2e10;
    --warn-soft-border: #5c4a1c;
    --ok: #4ade80;
    --ok-soft: #163828;
    --ok-soft-border: #245c40;
    --info-soft: #17324a;
    --info-soft-border: #2c4a68;
    --info-text: #bfe0fa;
    --code-bg: #071018;
    --code-text: #cfe6f7;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
  }
  ::selection { background: var(--gold); color: var(--gold-ink); }

  header {
    background: var(--accent);
    padding-block: 26px 22px;
  }
  .header-inner { max-width: 1000px; margin: 0 auto; padding-inline: 16px; }
  header h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(24px, 4vw, 38px);
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--accent-ink);
    text-wrap: balance;
  }

  .toolbar {
    max-width: 1000px;
    margin: 0 auto;
    padding-inline: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-block: 10px;
    border-bottom: 2px solid var(--border);
  }
  .toolbar .spacer { flex: 1; }
  .engine-badge {
    font-size: 12px;
    color: var(--muted);
    font-family: var(--font-mono);
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
  }

  .tabs {
    max-width: 1000px;
    margin: 0 auto;
    padding-inline: 16px;
    display: flex;
    gap: 4px;
    border-bottom: 2px solid var(--border);
  }
  .tab-btn {
    border: none;
    background: transparent;
    padding: 12px 16px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.01em;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-top: 5px solid var(--accent);
    border-radius: var(--radius);
    padding: clamp(18px, 4vw, 30px);
    max-width: 560px;
    margin: 0 auto;
  }
  .law-title { text-align: center; color: var(--muted); font-weight: 500; font-size: 14px; margin-bottom: 10px; font-family: var(--font-mono); letter-spacing: 0.02em; }
  .progress-note { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .question { margin: 0 0 8px; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; text-wrap: balance; }
  .supportive { color: var(--muted); font-size: 14px; margin-top: 0; }
  .answer-controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 6px; }
  .field-error { color: var(--danger); font-size: 13px; min-height: 18px; }

  .btn {
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 10px 16px;
    border-radius: var(--radius);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn-choice { min-width: 92px; font-weight: 600; }
  .btn-secondary { background: var(--accent-soft); border-color: var(--accent-soft-border); color: var(--accent); font-weight: 600; }
  .btn-link { background: none; border: none; color: var(--accent); text-decoration: underline; padding: 6px 0; }
  .btn-danger-outline { color: var(--danger); border-color: var(--danger-soft-border); background: var(--danger-soft); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  .outcome-badge {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 9px 16px;
    border-radius: var(--radius);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.005em;
    margin-bottom: 12px;
    font-family: var(--font-display);
  }
  .path-trace {
    font-family: var(--font-mono);
    font-size: 13px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .supportive-list { padding-left: 18px; font-size: 14px; color: var(--muted); }
  .card h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 18px 0 8px; font-family: var(--font-mono); }

  .text-input {
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: var(--font-body);
    background: var(--surface);
    color: var(--text);
    width: 160px;
  }
  .text-input.wide { width: 100%; }
  .text-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .notice { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
  .notice ul { margin: 6px 0 0; padding-left: 18px; }
  .notice-error { background: var(--danger-soft); border: 1px solid var(--danger-soft-border); color: var(--danger); }
  .notice-warn { background: var(--warn-soft); border: 1px solid var(--warn-soft-border); color: var(--warn); }
  .notice-ok { background: var(--ok-soft); border: 1px solid var(--ok-soft-border); color: var(--ok); }
  .notice-info { background: var(--info-soft); border: 1px solid var(--info-soft-border); color: var(--info-text); }

  section.builder-block { margin-bottom: 30px; }
  section.builder-block h3 {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.005em;
    margin-bottom: 14px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 10px;
  }
  .step-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    flex: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    border-radius: var(--radius);
  }

  .editor-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 13px; }
  .editor-table th, .editor-table td { border: 1px solid var(--border); padding: 6px; text-align: left; vertical-align: top; }
  .editor-table th { background: var(--surface-2); font-weight: 600; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .editor-table .text-input { width: 100%; min-width: 70px; }

  .node-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 12px; }
  .node-card { border: 2px solid var(--border); border-radius: var(--radius); padding: 14px; background: var(--surface); }
  .node-card-outcome { background: var(--accent-soft); border-color: var(--accent-soft-border); }
  .node-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .node-id-badge { font-family: var(--font-mono); background: var(--surface-2); color: var(--accent); padding: 2px 8px; border-radius: var(--radius); font-size: 13px; font-weight: 700; }
  .node-id-badge.outcome { background: var(--gold); color: var(--gold-ink); }
  /* Fixed column count (no auto-fit) so every node card lays out the same
     way regardless of content width — see the field order comment in
     decisionNodeCard for which field lands in which slot. */
  .node-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 16px; align-items: start; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  .branch-target { grid-column: span 2; }
  @media (max-width: 700px) {
    .node-grid { grid-template-columns: repeat(2, 1fr); }
    .branch-target { grid-column: span 1; }
  }
  @media (max-width: 480px) {
    .node-grid { grid-template-columns: 1fr; }
  }
  .branch-hint { font-size: 11px; color: var(--muted); margin-top: 2px; padding-left: 8px; border-left: 2px solid var(--accent); line-height: 1.4; overflow-wrap: anywhere; }
  .field:has(input[type="checkbox"]:disabled) { color: var(--muted); opacity: 0.7; }

  .add-node-row { display: flex; gap: 8px; flex-wrap: wrap; }

  #json-preview {
    background: var(--code-bg);
    color: var(--code-text);
    padding: 14px;
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 12px;
    max-height: 280px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .tests-table { font-size: 12px; font-family: var(--font-mono); }
  .tests-table th { font-family: var(--font-mono); }
  .tests-table tr.edge-boundary td { background: var(--warn-soft); }
  .tests-table tr.edge-negative td { background: var(--danger-soft); }
  .tests-table td, .tests-table th { font-variant-numeric: tabular-nums; }
  .tests-table td:first-child, .tests-table th:first-child { font-family: var(--font-mono); }

  #meta-editor label, #start-editor { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  #start-editor { margin-bottom: 16px; font-size: 14px; display: flex; align-items: center; gap: 8px; }

  input[type="file"] { font-size: 13px; color: var(--muted); }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }

  @media (max-width: 480px) {
    .toolbar, .tabs, main, .header-inner { padding-inline: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Rules as Code Prototype</h1>
  </div>
</header>

<div class="toolbar">
  <button class="btn" id="new-rules">New</button>
  <label class="btn" style="margin:0;">
    Upload JSON
    <input type="file" id="upload-json" accept="application/json" style="display:none;">
  </label>
  <button class="btn btn-primary" id="download-json">Download JSON</button>
  <div class="spacer"></div>
  <span id="engine-status" class="engine-badge" title="Condition evaluation engine in use"></span>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="play">Play</button>
  <button class="tab-btn" data-tab="build">Build</button>
  <button class="tab-btn" data-tab="tests">Test suite</button>
</div>

<main>

  <div class="tab-panel active" id="tab-play">
    <div id="play-root"></div>
  </div>

  <div class="tab-panel" id="tab-build">
    <section class="builder-block">
      <h3><span class="step-num">1</span> Law / provision</h3>
      <div id="meta-editor"></div>
    </section>

    <section class="builder-block">
      <h3><span class="step-num">2</span> Data dictionary (variables)</h3>
      <div id="attributes-editor"></div>
    </section>

    <section class="builder-block">
      <h3><span class="step-num">3</span> Decision tree nodes</h3>
      <div id="start-editor"></div>
      <div id="nodes-editor"></div>
    </section>

    <section class="builder-block">
      <h3><span class="step-num">4</span> Validation</h3>
      <div id="validation-results"></div>
    </section>

    <section class="builder-block">
      <h3><span class="step-num">5</span> Raw JSON</h3>
      <pre id="json-preview"></pre>
    </section>
  </div>

  <div class="tab-panel" id="tab-tests">
    <div id="tests-root"></div>
  </div>

</main>

<script src="vendor/json-rules-engine.bundle.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
